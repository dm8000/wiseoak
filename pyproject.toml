[project]
name = "wiseoak"
version = "0.1.0"
description = "Consulta a livro-texto de anestesiologia: RAG hierarquico + LangGraph sobre MedGemma local"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "httpx>=0.28",
    "numpy>=2.0",
    "rank-bm25>=0.2.2",
    "pypdf>=6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
studio = ["langgraph-cli[inmem]>=0.4"]

[tool.setuptools.packages.find]
include = ["wiseoak*"]
